<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#180508">
  <meta name="description" content="JesseOS — a local, offline-first dream terminal.">
  <title>JesseOS v0.6 — LBSTRCOMP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="room" aria-label="JesseOS LBSTRCOMP workstation">
    <div class="wall-glow" aria-hidden="true"></div>

    <section class="desk">
      <section class="monitor" aria-label="LBSTRCOMP monitor">
        <div class="monitor-vent" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="screen-bezel">
          <div class="screen-glass">
            <main class="terminal-shell" aria-label="JesseOS terminal">
              <header class="terminal-header">
                <span>JESSEOS v0.6</span>
                <span id="status" aria-live="polite">BOOTING...</span>
              </header>

              <section
                id="transcript"
                class="transcript"
                aria-live="polite"
                aria-label="Terminal output"
              ></section>

              <form id="input-form" class="input-row" autocomplete="off">
                <label class="prompt" for="input">input/</label>
                <input
                  id="input"
                  name="input"
                  type="text"
                  inputmode="text"
                  enterkeyhint="send"
                  autocomplete="off"
                  autocapitalize="sentences"
                  spellcheck="true"
                  aria-label="Message JesseOS"
                >
              </form>
            </main>
          </div>
        </div>

        <footer class="monitor-lower-bezel">
          <span class="brand">LBSTRCOMP</span>

          <span class="power-cluster" aria-label="Power on">
            <span class="power-led" aria-hidden="true"></span>
            <span class="power-label">POWER</span>
          </span>
        </footer>

        <div class="monitor-foot" aria-hidden="true"></div>
      </section>

      <section class="keyboard" aria-label="LBSTRCOMP touch keyboard">
        <div class="key-row key-row-numbers">
          <button class="key key-red key-action" type="button" data-key="escape" aria-label="Escape">ESC</button>
          <button class="key" type="button" data-key="1">1</button>
          <button class="key" type="button" data-key="2">2</button>
          <button class="key" type="button" data-key="3">3</button>
          <button class="key" type="button" data-key="4">4</button>
          <button class="key" type="button" data-key="5">5</button>
          <button class="key" type="button" data-key="6">6</button>
          <button class="key" type="button" data-key="7">7</button>
          <button class="key" type="button" data-key="8">8</button>
          <button class="key" type="button" data-key="9">9</button>
          <button class="key" type="button" data-key="0">0</button>
          <button class="key key-delete key-action" type="button" data-key="backspace" aria-label="Delete one character">DEL</button>
        </div>

        <div class="key-row key-row-letters">
          <button class="key key-tab key-action" type="button" data-key="tab">TAB</button>
          <button class="key" type="button" data-key="q">Q</button>
          <button class="key" type="button" data-key="w">W</button>
          <button class="key" type="button" data-key="e">E</button>
          <button class="key" type="button" data-key="r">R</button>
          <button class="key" type="button" data-key="t">T</button>
          <button class="key" type="button" data-key="y">Y</button>
          <button class="key" type="button" data-key="u">U</button>
          <button class="key" type="button" data-key="i">I</button>
          <button class="key" type="button" data-key="o">O</button>
          <button class="key" type="button" data-key="p">P</button>
          <button class="key" type="button" data-key="+">+</button>
        </div>

        <div class="key-row key-row-letters">
          <button class="key key-ctrl key-action" type="button" data-key="control">CTRL</button>
          <button class="key" type="button" data-key="a">A</button>
          <button class="key" type="button" data-key="s">S</button>
          <button class="key" type="button" data-key="d">D</button>
          <button class="key" type="button" data-key="f">F</button>
          <button class="key" type="button" data-key="g">G</button>
          <button class="key" type="button" data-key="h">H</button>
          <button class="key" type="button" data-key="j">J</button>
          <button class="key" type="button" data-key="k">K</button>
          <button class="key" type="button" data-key="l">L</button>
          <button class="key" type="button" data-key=":">:</button>
          <button class="key key-return key-action" type="button" data-key="enter">RETURN</button>
        </div>

        <div class="key-row key-row-letters">
          <button class="key key-shift key-action" type="button" data-key="shift" aria-label="Shift">SHIFT</button>
          <button class="key" type="button" data-key="z">Z</button>
          <button class="key" type="button" data-key="x">X</button>
          <button class="key" type="button" data-key="c">C</button>
          <button class="key" type="button" data-key="v">V</button>
          <button class="key" type="button" data-key="b">B</button>
          <button class="key" type="button" data-key="n">N</button>
          <button class="key" type="button" data-key="m">M</button>
          <button class="key" type="button" data-key=",">,</button>
          <button class="key" type="button" data-key=".">.</button>
          <button class="key key-shift key-action" type="button" data-key="shift" aria-label="Shift">SHIFT</button>
        </div>

        <div class="key-row key-row-bottom">
          <button class="key key-red key-small key-action" type="button" data-key="run">RUN</button>
          <button class="key key-red key-small key-action" type="button" data-key="stop">STOP</button>
          <button class="key key-space key-action" type="button" data-key="space">SPACE</button>
          <button class="key key-small key-action" type="button" data-key="f1">F1</button>
          <button class="key key-small key-action" type="button" data-key="f3">F3</button>
          <button class="key key-small key-action" type="button" data-key="f5">F5</button>
          <button class="key key-small key-action" type="button" data-key="/">/</button>
        </div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
