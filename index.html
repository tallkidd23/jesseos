<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>JesseOS v0.3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="crt" aria-label="JesseOS terminal">
    <section id="screen">
      <header id="status" aria-live="polite">
        <span>JESSEOS v0.3</span>
        <span id="engine-status">LOCAL DREAM ENGINE</span>
        <span id="typing-status">READY</span>
      </header>
      <div id="output" role="log" aria-live="polite" aria-relevant="additions"></div>
      <form id="input-line" autocomplete="off">
        <label id="prompt" for="input">jesseos@lobster-box:~$</label>
        <input id="input" type="text" inputmode="text" autocapitalize="sentences" spellcheck="false" enterkeyhint="send" aria-label="Message JesseOS" />
      </form>
      <div id="scanlines" aria-hidden="true"></div>
      <div id="glow" aria-hidden="true"></div>
    </section>
  </main>
  <script src="data/corpus.js"></script>
  <script src="app.js"></script>
</body>
</html>
